services:
  postgres:
    image: postgres:16.1.1-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    volumes:
      - footiq_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7.2.4
    ports:
      - "6379:6379"
    volumes:
      - footiq_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=local
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/postgres
      - DATABASE_URL_SYNC=postgresql://postgres:postgres@postgres:5432/postgres
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - SUPABASE_URL=http://postgres:54321
      - SUPABASE_ANON_KEY=local-dev-anon-key
      - SUPABASE_SERVICE_ROLE_KEY=local-dev-service-key
    volumes:
      - ./:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A workers.celery_app worker --loglevel=info --concurrency=1
    environment:
      - ENVIRONMENT=local
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/postgres
      - DATABASE_URL_SYNC=postgresql://postgres:postgres@postgres:5432/postgres
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - DEVICE=auto
      - YOLO_MODEL=yolov10n.pt
      - CONFIDENCE_THRESHOLD=0.35
      - TRACKER=bytetrack
      - FRAME_SKIP=2
    volumes:
      - ./:/app
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  footiq_pgdata:
  footiq_redis:
