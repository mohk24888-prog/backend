[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "footiq-backend"
version = "0.1.0"
description = "FootIQ Football Intelligence Platform API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Golden Feet Network" }]

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "core*", "db*", "services*", "workers*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
